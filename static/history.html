<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文件夹任务历史 - Excel 处理工具</title>
  <link rel="icon" type="image/png" href="/static/images/dev-toolbox-logo.png">
  <link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/theme.css">
  <style>
    .history-layout { display:grid; grid-template-columns:minmax(250px, 1fr) minmax(0, 3fr); gap:20px }
    .history-folder { display:block; width:100%; margin:0 0 12px; padding:14px; text-align:left; overflow-wrap:anywhere; color:var(--garden-ink); background:var(--garden-field); border:1px solid var(--garden-field-border); border-radius:var(--garden-field-radius); cursor:pointer }
    .history-folder:hover { background:#f3f7eb }
    .history-folder[aria-pressed=true] { background:#e8f5ce; border-color:#accb7b }
    .history-folder small { display:block; margin-top:8px }
    .history-path { overflow-wrap:anywhere }
    .history-scroll { overflow:auto; max-height:520px }
    .history-log { white-space:pre-wrap; overflow-wrap:anywhere; max-height:300px; overflow:auto }
    .history-controls { margin-top:14px }
    .history-controls .input-groove-wrap { flex:0 1 520px }
    .history-controls input::placeholder { color:var(--ink-3) }
    .history-error { margin:12px 0 0; color:#a12725; font-weight:700 }
    .history-error:empty { display:none }
    @media (max-width: 700px) { .history-layout { grid-template-columns:minmax(0,1fr); } }
  </style>
  <link rel="stylesheet" href="/static/theme-casual.css">
  <link rel="stylesheet" href="/static/theme-cartoon.css">
</head>
<body>
  <header class="app-header">
    <a href="/" class="header-brand"><div class="header-logo-badge" aria-hidden="true"></div><div class="header-title"><h1 class="header-title-text">文件夹任务历史</h1><span class="subtitle">分别保存进度，随时查看和继续处理</span></div></a>
    <nav class="header-nav" aria-label="功能导航"><a href="/" class="nav-link"><span class="ui-icon harbor-icon icon-home" aria-hidden="true"></span>主页</a><a href="/workbench" class="nav-link"><span class="ui-icon harbor-icon icon-search" aria-hidden="true"></span>切字检查</a><a href="/records" class="nav-link"><span class="ui-icon harbor-icon icon-layers" aria-hidden="true"></span>执行记录</a><a href="/history" class="nav-link active" aria-current="page"><span class="ui-icon harbor-icon icon-folder" aria-hidden="true"></span>文件夹历史</a></nav>
  </header>
  <main class="container">
    <section class="panel"><p>选择文件夹查看已保存的结果和执行明细。浏览历史不会切换当前工作台；恢复后可继续审核、复检，或继续暂停的任务。</p><div class="controls history-controls"><div class="input-groove-wrap"><span class="input-groove-icon" aria-hidden="true">🔍</span><input id="filter" type="search" placeholder="搜索文件夹路径" aria-label="搜索文件夹" spellcheck="false" autocomplete="off"></div><button id="refresh" class="btn btn-outline" type="button">🔄 刷新记录</button></div><p id="error" class="history-error" role="alert"></p></section>
    <div class="history-layout">
      <aside id="folders" aria-label="已保存的文件夹"></aside>
      <section id="detail" class="panel" aria-live="polite"><p>选择一个文件夹查看记录。</p></section>
    </div>
  </main>
  <script src="/static/history.js"></script>
</body>
</html>
