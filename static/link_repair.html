<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修复引用错误 - Excel 整理工具箱</title>
  <link rel="icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/repair.css">
  <link rel="stylesheet" href="/static/theme-casual.css">
  <script src="/static/tools.js?v=1"></script>
  <link rel="stylesheet" href="/static/theme-cartoon.css">
</head>
<body data-repair-kind="links">
  <header class="app-header">
    <a href="/" class="header-brand"><div class="header-logo-badge" aria-hidden="true"></div><div class="header-title"><h1 class="header-title-text">修复引用错误</h1><span class="subtitle">对照原始备份 · 恢复计算结果</span></div></a>
    <nav class="header-nav" aria-label="功能导航"><a href="/" class="nav-link"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#home"></use></svg>主页</a><a href="/repair-colors" class="nav-link"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#palette"></use></svg>修复颜色</a><a href="/repair-hidden" class="nav-link"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#eye"></use></svg>修复隐藏页</a><a href="/repair-bl-links" class="nav-link"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#target"></use></svg>排查 BL 超链接</a><a href="/workbench" class="nav-link"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#search"></use></svg>切字检查</a></nav>
  </header>
  <main class="container clean-container">
    <section class="panel">
      <h2>扫描引用错误，对照备份直接修复</h2>
      <p class="toolbar-hint">扫描全部工作表中的 #REF!，包括隐藏表和间接产生的引用错误。对照备份里的原公式与计算结果，恢复为固定值，并保留当前格式。</p>
      <div class="link-fields">
        <label for="repairFolder">当前 Excel 文件夹（含子文件夹）<textarea id="repairFolder" class="workbook-paths" rows="2" aria-label="Excel 文件或文件夹路径" placeholder="每行一个 Excel 文件或文件夹路径"></textarea></label>
        <label for="repairOldFolder">默认参考文件夹<input id="repairOldFolder" type="text" placeholder="按 Excel 文件名搜索此文件夹及子文件夹"></label>
      </div>
      <div class="link-actions">
        <button id="repairRun" class="btn btn-primary" type="button" disabled>🔗 扫描并修复引用错误</button>
      </div>
      <p class="toolbar-hint">复杂公式恢复的是备份中的完整计算结果。配对不明确、附近内容已变、备份本身也报错的格子会列出原因，留给人工检查。修复前请保存并关闭目标 Excel 文件。</p>
      <p class="toolbar-hint">点击后自动完成扫描、备份对比和修复，直接保存当前文件。关闭网页后任务继续。</p>
      <p id="repairProgress" role="status" aria-live="polite">填写两个文件夹，一次完成扫描和修复。</p>
      <div class="progress-track progress-track-sm"><div id="repairProgressFill" class="progress-fill" style="width:0%"></div></div>
      <p id="repairError" class="batch-error" role="alert"></p>
    </section>
    <section class="panel"><h2 id="repairResultTitle">修复结果</h2><p id="repairResultFolder" class="toolbar-hint"></p><div id="repairFilters" hidden></div><div id="repairResults"><p>尚未开始。</p></div></section>
    <section class="panel"><details><summary>调试日志</summary><div data-debug-log-tools></div></details></section>
  </main>
  <script src="/static/eta.js"></script><script src="/static/job_panel.js"></script><script src="/static/open_excel.js"></script><script src="/static/highlight_colors.js"></script><script src="/static/repair.js"></script><script src="/static/debug_log.js"></script>
  <script src="/static/task_folder.js"></script><script src="/static/reference_folders.js"></script><script src="/static/focus_banner.js"></script><script src="/static/file_problem.js"></script>
</body>
</html>
