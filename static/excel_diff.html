<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel 对比 - Excel 整理工具箱</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/repair.css"><script src="/static/game_fx.js"></script>
  <style>
    .xd-files { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .xd-file { padding: 12px 14px; border: 2px solid; border-radius: 12px; overflow-wrap: anywhere; }
    .xd-file strong { display: block; margin-bottom: 4px; }
    .xd-file small { color: #3b4658; }
    .xd-file.is-old { background: #ffebe9; border-color: #cf222e; }
    .xd-file.is-new { background: #e6ffec; border-color: #1a7f37; }
    .xd-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 10px; }
    .xd-fields label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
    .xd-fields input { font-weight: 400; }
    .xd-verdict { margin: 14px 0 8px; padding: 12px 16px; border-radius: 12px; font-weight: 800; font-size: 17px; border: 2px solid; }
    .xd-verdict.is-same { background: #e4f5ea; border-color: #1a7f37; color: #14532d; }
    .xd-verdict.is-diff { background: #fff3d6; border-color: #b7791f; color: #5c3b00; }
    .xd-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .xd-chip { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1.5px solid #8a94a6; background: #fff; color: #1f2937; cursor: pointer; }
    .xd-chip b { margin-left: 4px; }
    .xd-chip.is-off { background: #e5e7eb; color: #4b5563; text-decoration: line-through; }
    .xd-chip.is-static { cursor: default; }
    .xd-chip.is-old { background: #ffebe9; border-color: #cf222e; color: #82071e; }
    .xd-chip.is-new { background: #e6ffec; border-color: #1a7f37; color: #14532d; }
    .xd-chip.is-gray { background: #eef1f5; border-color: #8a94a6; color: #374151; }
    .xd-sheet { margin: 12px 0; border: 2px solid #c7cfdb; border-radius: 12px; background: #fff; overflow: hidden; }
    .xd-sheet > summary { padding: 10px 14px; cursor: pointer; font-weight: 800; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #f3f5f9; color: #111827; }
    .xd-sheet.is-old > summary { background: #ffebe9; } .xd-sheet.is-new > summary { background: #e6ffec; }
    .xd-sheet.is-same > summary, .xd-sheet.is-doomed > summary { background: #eef1f5; color: #374151; }
    .xd-badge { font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: #fff; border: 1.5px solid #8a94a6; color: #1f2937; }
    .xd-body { padding: 4px 14px 12px; }
    .xd-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
    .xd-table th { text-align: left; padding: 6px 8px; border-bottom: 2px solid #c7cfdb; color: #1f2937; }
    .xd-table td { padding: 6px 8px; border-bottom: 1px solid #e3e8ef; vertical-align: top; overflow-wrap: anywhere; white-space: pre-wrap; color: #111827; }
    .xd-table col.c-where { width: 190px; } .xd-table col.c-kind { width: 96px; }
    .xd-old { background: #ffebe9; } .xd-new { background: #e6ffec; }
    .xd-none { background: #f3f5f9; color: #4b5563 !important; }
    .xd-old::before { content: "− "; color: #cf222e; font-weight: 800; } .xd-new::before { content: "+ "; color: #1a7f37; font-weight: 800; }
    .xd-none::before { content: ""; }
    .xd-kind { font-weight: 700; color: #374151; }
    .xd-swatch { display: inline-block; width: 14px; height: 14px; margin-right: 5px; border: 1px solid #111827; border-radius: 3px; vertical-align: -2px; }
    .xd-more { color: #5c3b00; font-weight: 700; }
    .xd-hidden { display: none !important; }
  </style>
  <link rel="stylesheet" href="/static/theme-casual.css">
  <link rel="stylesheet" href="/static/theme-cartoon.css">
</head>
<body>
  <header class="app-header">
    <a href="/" class="header-brand"><div class="header-logo-badge">🔍</div><div class="header-title"><h1>Excel 对比</h1><span class="subtitle">像 Git 一样左右两栏看两份 Excel 哪里不一样 · 上传前自己判断能不能覆盖</span></div></a>
    <nav class="header-nav"><a href="/" class="nav-link">🏠 主页</a><a href="/distribute" class="nav-link">📤 上传</a></nav>
  </header>
  <main class="container clean-container">
    <section class="panel">
      <h2>对比哪两份</h2>
      <div class="xd-fields">
        <label for="xdTheirs">远程现在这份（旧，左边）<input id="xdTheirs" type="text" spellcheck="false" autocomplete="off" placeholder="共享 / 终点里那份 Excel 的完整路径"></label>
        <label for="xdMine">你要上传的这份（新，右边）<input id="xdMine" type="text" spellcheck="false" autocomplete="off" placeholder="你改好的那份 Excel 的完整路径"></label>
      </div>
      <div class="link-actions"><button id="xdRun" class="btn btn-primary" type="button">🔍 开始对比</button></div>
      <p class="toolbar-hint">只读两份文件，不改任何东西，也不用关 Excel。比：每格的文字、公式、字体字号、字的颜色、填充色、边框、对齐换行、数字格式；整张表的行高列宽、合并单元格、打印设置、图片图形个数、标签颜色。
        图片图形只比个数（位置大小请点文件名在 Excel 里看）。只支持 .xlsx / .xlsm。</p>
      <p id="xdStatus" role="status" aria-live="polite"></p>
      <p id="xdError" class="batch-error" role="alert"></p>
    </section>
    <section class="panel">
      <h2>对比结果</h2>
      <div id="xdResult"><p>填好两份文件的路径后点「🔍 开始对比」。从上传页点「🔍 对比」进来会自动开始。</p></div>
    </section>
    <section class="panel"><details><summary>调试日志</summary><div data-debug-log-tools></div></details></section>
  </main>
  <script src="/static/dialog.js"></script><script src="/static/open_excel.js"></script>
  <script src="/static/excel_diff.js"></script><script src="/static/debug_log.js"></script>
</body>
</html>
