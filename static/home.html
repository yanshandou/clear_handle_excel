<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel 整理工具箱 - 主页</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/home_route.css?v=3"><link rel="stylesheet" href="/static/work_task.css?v=6"><link rel="stylesheet" href="/static/theme-casual.css"><script src="/static/game_fx.js"></script>
  <link rel="stylesheet" href="/static/theme-cartoon.css">
  <link rel="stylesheet" href="/static/home_tiles.css?v=1">
</head>
<body>
  <header class="app-header">
    <a href="/" class="header-brand" title="返回主页">
      <div class="header-logo-badge" aria-hidden="true"></div>
      <div class="header-title">
        <h1 class="header-title-text">Excel 整理工坊</h1>
      </div>
    </a>
    <nav class="header-nav" aria-label="功能导航">
      <a href="/" class="nav-link active" aria-current="page"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#home"></use></svg>主页</a>
      <a href="/clean" class="nav-link"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#grid"></use></svg>精简 Sheet</a>
      <a href="/workbench" class="nav-link"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#search"></use></svg>切字检查</a>
      <a href="/analysis" class="nav-link"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#chart"></use></svg>扫描分析</a>
      <a href="/history" class="nav-link"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#folder"></use></svg>文件夹历史</a>
      <a href="/records" class="nav-link"><svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#layers"></use></svg>
        执行记录
        <span id="navProgressBadge" class="nav-badge">0%</span>
      </a>
      <span id="statusText" class="status-pill">✅ 就绪</span>
    </nav>
  </header>

  <main class="container home-container">
    <section class="home-tools-heading" aria-label="工具与进度备份">
      <div><h2>我的工具箱</h2><p id="routeDoneNote" class="route-done-note hidden"></p></div>
      <div class="home-hero-actions">
        <button type="button" class="btn btn-outline btn-sm" id="exportProgressBtn" onclick="exportProgress()"
          title="把扫描结果、人工判断、续跑点和执行记录保存为备份文件">
          <svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#download"></use></svg>导出进度
        </button>
        <button type="button" class="btn btn-outline btn-sm" id="importProgressBtn" onclick="pickProgressFile()"
          title="从备份文件恢复进度，会替换当前全部进度">
          <svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#upload"></use></svg>导入进度
        </button>
        <button type="button" class="btn btn-outline btn-sm" onclick="openFileProblemSettings()"
          title="批量任务遇到出错的文件时：等你选择重试 / 跳过，或者多少分钟没人选就自动跳过">
          <svg class="ui-icon" aria-hidden="true"><use href="/static/icons/garden-ui.svg#settings"></use></svg>出错时
        </button>
        <input type="file" id="progressFileInput" class="hidden" accept=".json,application/json">
      </div>
    </section>

    <!-- 最近任务状态条：有任务记录时显示 -->
    <section id="taskStrip" class="panel home-strip hidden" aria-live="polite">
      <div class="home-strip-info">
        <span id="stripBadge" class="badge badge-ignored">⚪ 空闲</span>
        <b id="stripTitle" class="home-strip-title">尚未开始任务</b>
        <span id="stripStep" class="home-strip-step"></span>
      </div>
      <div class="home-strip-progress">
        <div class="progress-track progress-track-sm">
          <div id="stripFill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <span id="stripPct" class="home-strip-pct">0%</span>
      </div>
      <div class="home-strip-actions">
        <button type="button" id="stripResumeBtn" class="btn btn-success btn-sm hidden" onclick="resumeTask()">
          继续上次任务
        </button>
        <a href="/records" class="btn btn-outline btn-sm">查看执行记录 ↗</a>
      </div>
    </section>

    <!-- 当前任务：一个任务对应共享文件夹里的一个文件夹；只填共享路径，参考 / 处理文件夹自动生成（static/work_task.js） -->
    <section id="workTaskPanel" class="work-task-bar" aria-label="当前任务">
      <span class="work-task-title">📁 当前任务：<strong id="workTaskName">还没有任务</strong></span>
      <details class="work-task-more"><summary>看路径</summary><dl id="workTaskPaths" class="work-task-paths"></dl>
        <p id="workTaskHint" class="work-task-hint"></p></details>
      <div class="work-task-switch">切换
        <div class="wt-pick">
          <button id="workTaskSwitch" class="wt-pick-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="workTaskSwitchList">
            <span id="workTaskSwitchText">（没有以前的任务）</span><span class="wt-pick-arrow" aria-hidden="true">▾</span></button>
          <ul id="workTaskSwitchList" class="wt-pick-list" role="listbox" aria-label="以前的任务" hidden></ul>
        </div>
      </div>
      <button id="workTaskSingle" class="work-task-single" type="button"
        title="只调整默认路径的来源；各功能的文件夹始终可以自由修改">📂 自选路径优先</button>
    </section>


    <!-- 卡片页（用户 2026-11-11 要）：流程、主要卡片、更多工具并成一张大小卡片拼起来的卡片页。
         卡片由 static/home_tiles.js 画（工具清单在 static/tools.js），状态文字 id、上传卡 id、新任务 / 完成任务的 id 都和以前一样 -->
    <section class="tile-board" aria-label="工具箱">
      <ol class="tile-grid" id="tileGrid"></ol>
    </section>
  </main>

  <!-- 单项功能对话框：填写文件夹 → 执行 → 查看结果（精简 Sheet 在独立页面 /clean） -->
  <dialog id="taskDialog" class="task-dialog" aria-labelledby="taskDialogTitle">
    <div id="taskDialogHead" class="task-dialog-head feature-sky">
      <span id="taskDialogIcon" class="task-dialog-icon" aria-hidden="true">📄</span>
      <div class="task-dialog-heading">
        <h2 id="taskDialogTitle">调整页面</h2>
        <p id="taskDialogSub"></p>
      </div>
      <button type="button" class="task-dialog-close" onclick="closeTask()" aria-label="关闭">✕</button>
    </div>

    <div class="task-dialog-body">
      <ul id="taskNotes" class="task-notes"></ul>

      <label class="task-field-label" for="taskFolderInput">Excel 文件或文件夹路径</label>
      <div class="input-groove-wrap">
        <span class="input-groove-icon" aria-hidden="true">📂</span>
        <textarea id="taskFolderInput" class="workbook-paths" rows="2" aria-label="Excel 文件或文件夹路径" placeholder="每行一个 Excel 文件或文件夹路径"></textarea>
      </div>

      <div id="taskRunBox" class="task-run-box hidden">
        <div class="mini-progress-box">
          <div class="mini-progress-info">
            <span id="taskStepText">等待开始...</span>
            <span id="taskStatsText">0%</span>
          </div>
          <div class="progress-track progress-track-sm">
            <div id="taskProgressFill" class="progress-fill" style="width: 0%;"></div>
          </div>
        </div>
        <div id="taskResult" class="task-result hidden"></div>
        <div class="console-frame">
          <div class="console-frame-bar">
            <span class="console-dots"><i></i><i></i><i></i></span>
            <span>实时处理日志</span>
          </div>
          <div class="log-box" id="taskLogBox">等待操作...</div>
        </div>
        <div data-debug-log-tools></div>
      </div>
    </div>

    <div class="task-dialog-foot">
      <span id="taskHint" class="task-hint"></span>
      <button type="button" class="btn btn-outline" onclick="closeTask()">关闭</button>
      <button type="button" class="btn btn-primary" id="taskPrimaryBtn" onclick="onPrimaryAction()">开始</button>
    </div>
  </dialog>

  <script src="/static/eta.js"></script><script src="/static/job_panel.js"></script><script src="/static/dialog.js"></script>
  <script src="/static/tools.js?v=1"></script><script src="/static/home_tiles.js?v=1"></script>
  <script src="/static/home.js"></script>
  <script src="/static/work_task.js?v=8"></script>
  <script src="/static/debug_log.js"></script>
  <script src="/static/task_folder.js"></script><script src="/static/focus_banner.js"></script><script src="/static/file_problem.js"></script>
</body>
</html>
